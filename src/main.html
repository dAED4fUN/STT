<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Recorder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
        }

        .container {
            text-align: center;
        }

        .title {
            font-size: 18px;
            opacity: 0.7;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .voice-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            position: relative;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.4),
                inset 0 0 10px rgba(255, 255, 255, 0.1);

            display: flex;
            align-items: center;
            justify-content: center;

            transition: all 0.25s ease;
        }

        .voice-btn:hover {
            transform: scale(1.05);
        }

        .voice-btn:active {
            transform: scale(0.95);
        }

        .voice-btn.recording {
            background: rgba(239, 68, 68, 0.2);
            box-shadow:
                0 0 0 0 rgba(239, 68, 68, 0.7),
                0 0 30px rgba(239, 68, 68, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                box-shadow: 0 0 0 25px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .icon {
            width: 28px;
            height: 28px;
            fill: white;
            opacity: 0.9;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">Tap to speak</div>

        <button id="voiceBtn" class="voice-btn">
            <!-- mic icon -->
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z" />
                <path
                    d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.08A7 7 0 0 0 19 11z" />
            </svg>
        </button>

        <div id="status" class="status">Idle</div>
    </div>

    <script>
        const btn = document.getElementById('voiceBtn');
        const status = document.getElementById('status');

        let isRecording = false;
        let socket;
        let audioContext;
        let processor;
        let source;

        btn.onclick = async (e) => {
            e.preventDefault();
            if (!isRecording) {
                // Start recording
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                socket = new WebSocket('ws://localhost:3000');

                socket.onopen = () => {
                    audioContext = new AudioContext({ sampleRate: 16000 });
                    source = audioContext.createMediaStreamSource(stream);
                    processor = audioContext.createScriptProcessor(4096, 1, 1);
                    source.connect(processor);
                    processor.connect(audioContext.destination);

                    processor.onaudioprocess = async (event) => {
                        const input = event.inputBuffer.getChannelData(0);
                        console.log(input);

                        const pcmBuffer = new ArrayBuffer(input.length * 2);
                        const pcmView = new DataView(pcmBuffer);

                        for (let i = 0; i < input.length; i++) {
                            let sample = Math.max(-1, Math.min(1, input[i]));
                            pcmView.setInt16(i * 2, sample * 0x7fff, true);
                        }
                        socket.send(pcmBuffer);
                    };

                    socket.send(JSON.stringify({ type: 'start' }));

                    status.innerText = 'Recording (PCM)...';
                    isRecording = true;
                };

                socket.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    status.innerText = data.text;
                };

            } else {
                processor.disconnect();
                source.disconnect();
                audioContext.close();

                socket.send(JSON.stringify({ type: 'stop' }));
                socket.close();

                status.innerText = 'Idle';
                isRecording = false;

            }
        };
    </script>
</body>

</html>
